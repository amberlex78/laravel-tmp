services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        working_dir: /var/www/html
        environment:
            DB_CONNECTION: mariadb
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-laravel}
            DB_USERNAME: ${DB_USERNAME:-laravel}
            DB_PASSWORD: ${DB_PASSWORD:-laravel}
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy

    nginx:
        image: nginx:1.30.4-alpine
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - .:/var/www/html:ro
            - vendor:/var/www/html/vendor:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_started

    db:
        image: mariadb:11.8.9
        environment:
            MARIADB_DATABASE: ${DB_DATABASE:-laravel}
            MARIADB_USER: ${DB_USERNAME:-laravel}
            MARIADB_PASSWORD: ${DB_PASSWORD:-laravel}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        ports:
            - "${DB_FORWARD_PORT:-3307}:3306"
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            start_period: 10s
            interval: 5s
            timeout: 5s
            retries: 10

    composer:
        image: composer:2.9.8
        profiles: ["tools"]
        working_dir: /var/www/html
        environment:
            GIT_CONFIG_COUNT: "1"
            GIT_CONFIG_KEY_0: safe.directory
            GIT_CONFIG_VALUE_0: /var/www/html
        entrypoint: ["composer"]
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor

    node:
        image: node:24-bookworm-slim
        working_dir: /var/www/html
        command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
        environment:
            CHOKIDAR_USEPOLLING: "true"
        ports:
            - "${VITE_FORWARD_PORT:-5173}:5173"
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules

volumes:
    mariadb_data:
    node_modules:
    vendor:
